name: Probe Canna Cabana HTML

on:
  push:
    branches:
      - feature/cannacabana-multisource-v207
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and inspect whole flower page
        run: |
          python - <<'PY'
          import re
          import urllib.request
          url = 'https://cannacabana.com/collections/whole-flower?sID=3658'
          req = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139 Safari/537.36',
              'Accept-Language': 'en-CA,en;q=0.9',
          })
          with urllib.request.urlopen(req, timeout=45) as r:
              body = r.read().decode('utf-8', 'ignore')
              print('STATUS', r.status)
              print('FINAL_URL', r.geturl())
          open('canna.html','w',encoding='utf-8').write(body)
          print('BYTES', len(body.encode()))
          for needle in ['Cherry Tang','Ice Cream Rntz','Lemon Gelato','Pink Pussy','Purple Dank','28 G','29.97','34.97','Elite','Market','THC','iframe','3658']:
              print('COUNT', needle, body.lower().count(needle.lower()))
          print('SCRIPT_IFRAME_SOURCES')
          for m in re.finditer(r'<(?:script|iframe)[^>]+(?:src|data-src)=["\\\']([^"\\\']+)', body, re.I):
              print(m.group(1))
          print('KNOWN_CONTEXT')
          for needle in ['Cherry Tang','Elite','THC','iframe','3658']:
              i = body.lower().find(needle.lower())
              print('---', needle, i)
              if i >= 0:
                  print(body[max(0,i-600):i+1600].replace('\\n',' ')[:2200])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canna-probe-html
          path: canna.html
