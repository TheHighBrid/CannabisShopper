name: Probe Canna Cabana API
on:
  push:
    branches: [feature/cannacabana-multisource-v207]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query exact Canna Cabana filters
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base='https://app.cannacabana.com/api/product/filterv2'
          params={
            'selectedOptions':'28 G',
            'collection':'whole-flower',
            'price_min':'0',
            'cbd_level_min':'0',
            'cbd_level_max':'100',
            'thc_level_min':'29.97',
            'thc_level_max':'34.97',
            'storeId':'3658',
            'page':'1',
            'limit':'100',
            'sortOrder':'asc',
            'sortField':'title',
            'priceType':'elite_price',
          }
          url=base+'?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Chrome/139','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=45) as r:
            raw=r.read().decode('utf-8','ignore')
            print('STATUS',r.status,'URL',r.geturl(),'BYTES',len(raw))
          open('canna-filter.json','w',encoding='utf-8').write(raw)
          data=json.loads(raw)
          print('TOP_KEYS',sorted(data.keys()))
          print('PAGINATION',json.dumps(data.get('pagination'),sort_keys=True))
          print('FILTERS',json.dumps(data.get('filters'),sort_keys=True)[:6000])
          print('RANGE',json.dumps(data.get('rangeFilters'),sort_keys=True))
          products=data.get('data') or []
          print('COUNT',len(products))
          for p in products:
            variants=p.get('variants') or []
            print('\nPRODUCT',p.get('title'),'| vendor=',p.get('vendor'),'| handle=',p.get('handle'),'| tags=',p.get('tags'))
            for v in variants:
              print(' VARIANT',v.get('title'),'sku=',v.get('sku'),'available=',v.get('available'),'pricing=',json.dumps(v.get('pricing'),sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canna-filter-json
          path: canna-filter.json
