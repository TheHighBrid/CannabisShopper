name: Probe Canna Cabana HTML
on:
  push:
    branches: [feature/cannacabana-multisource-v207]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Canna Cabana filters
        run: |
          python - <<'PY'
          import urllib.request
          u='https://cannacabana.com/collections/whole-flower?sID=3658'
          q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 Chrome/139','Accept-Language':'en-CA,en;q=0.9'})
          s=urllib.request.urlopen(q,timeout=45).read().decode('utf-8','ignore')
          open('canna.html','w',encoding='utf-8').write(s)
          for m in ['applyFilters', 'data-type="size"', 'data-type="thc"', 'thc-min', 'thc-max', 'selectedSizes', 'selectedSize', 'minTHC', 'maxTHC', 'min_thc', 'max_thc']:
              print('\n===== '+m+' =====')
              p=0
              for n in range(6):
                  i=s.find(m,p)
                  if i<0: break
                  print('\n---',i,'---')
                  print(s[max(0,i-5000):i+12000])
                  p=i+len(m)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canna-probe-html
          path: canna.html
