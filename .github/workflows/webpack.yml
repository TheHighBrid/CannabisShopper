name: CanShop CI and Android Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canshop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate TypeScript and web assets
        run: |
          npm install
          npm run check
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed sideload APK
        run: gradle --no-daemon clean assembleRelease

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk CanShop-v1.01.apk
          sha256sum CanShop-v1.01.apk | tee CanShop-v1.01.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CanShop-v1.01
          path: |
            CanShop-v1.01.apk
            CanShop-v1.01.apk.sha256
          if-no-files-found: error

      - name: Publish or refresh GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.1 >/dev/null 2>&1; then
            gh release upload v1.0.1 CanShop-v1.01.apk CanShop-v1.01.apk.sha256 --clobber
            gh release edit v1.0.1 --title "CanShop v1.01" --notes-file docs/RELEASE_NOTES_v1.01.md --latest
          else
            gh release create v1.0.1 CanShop-v1.01.apk CanShop-v1.01.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "CanShop v1.01" \
              --notes-file docs/RELEASE_NOTES_v1.01.md \
              --latest
          fi
