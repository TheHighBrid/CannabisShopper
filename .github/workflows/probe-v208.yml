name: Probe live retailer contracts v208

on:
  push:
    branches:
      - fix/bulkbuddy-eligibility-canna-timeout-v208
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Bulk Buddy and Canna Cabana
        run: |
          python - <<'PY'
          import re, time, json, urllib.parse, urllib.request
          from html.parser import HTMLParser

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139 Safari/537.36'

          class ProductParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.depth=0; self.capture=False; self.card_depth=0; self.cards=[]; self.parts=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  classes=set((attrs.get('class') or '').split())
                  if not self.capture and tag=='li' and 'product' in classes:
                      self.capture=True; self.card_depth=1; self.parts=[]
                  elif self.capture:
                      self.card_depth+=1
              def handle_endtag(self, tag):
                  if self.capture:
                      self.card_depth-=1
                      if self.card_depth==0:
                          self.cards.append(' '.join(self.parts))
                          self.capture=False
              def handle_data(self, data):
                  if self.capture:
                      s=' '.join(data.split())
                      if s: self.parts.append(s)

          bulk='https://www.bulkbuddy.co/?term=craft-cannabis-flowers&s=&post_type=product&taxonomy=product_cat'
          req=urllib.request.Request(bulk,headers={'User-Agent':UA,'Accept-Language':'en-CA,en;q=0.9'})
          t=time.time()
          with urllib.request.urlopen(req,timeout=30) as r:
              html=r.read().decode('utf-8','ignore')
          print('BULK_SECONDS',round(time.time()-t,3),'BYTES',len(html))
          p=ProductParser(); p.feed(html)
          relevant=[]
          for card in p.cards:
              if 'Craft' not in card: continue
              prices=[float(x) for x in re.findall(r'\$\s*([0-9]+(?:\.[0-9]{1,2})?)',card)]
              name_match=re.search(r'([A-Za-z0-9][A-Za-z0-9 +\'’.-]*AAAA\+[^$]{0,80}Craft)',card,re.I)
              name=' '.join((name_match.group(1) if name_match else card[:120]).split())
              relevant.append((name,min(prices) if prices else None,max(prices) if prices else None))
          print('BULK_CRAFT_CARDS',len(relevant))
          for item in relevant:
              print('BULK_CARD',item,'OUNCE_PLAUSIBLE',item[2] is None or item[2] >= 90)
          names=[
            'Grape Ape AAAA+ Hybrid Craft','Kombucha AAAA+ Hybrid Craft',
            'Pink Banner AAAA+ Indica Craft','Pink Pussy AAAA+ Indica Craft',
            'Pink Wagyu AAAA+ Indica Craft','Platinum Death Bubba AAAA+ Indica Craft',
            'Purple Banana Breath AAAA+ Indica Craft','Purple Dank Breath AAAA+ Indica Craft',
            'Supreme Death Bubba AAAA+ Indica Craft','Tuna Kush AAAA+ Indica Craft'
          ]
          plain=re.sub(r'<[^>]+>',' ',html)
          plain=' '.join(plain.split())
          for name in names:
              i=plain.lower().find(name.lower())
              if i<0:
                  print('BULK_KNOWN_MISSING',name); continue
              window=plain[i:i+500]
              prices=[float(x) for x in re.findall(r'\$\s*([0-9]+(?:\.[0-9]{1,2})?)',window)]
              print('BULK_KNOWN',name,'PRICES',prices[:6],'MAX',max(prices) if prices else None,'OUNCE_PLAUSIBLE',(max(prices)>=90 if prices else None))
          for name in ['Pink Banner AAAA+ Indica Craft','Pink Wagyu AAAA+ Indica Craft']:
              j=html.lower().find(name.lower())
              print('RAW_CONTEXT',name,'INDEX',j)
              if j>=0:
                  print(html[max(0,j-2200):j+4000].replace('\\n',' ')[:6200])

          base='https://app.cannacabana.com/api/product/filterv2'
          params={
            'selectedOptions':'28 G','collection':'whole-flower','price_min':'0',
            'cbd_level_min':'0','cbd_level_max':'100','thc_level_min':'29.97',
            'thc_level_max':'34.97','storeId':'3658','page':'1','limit':'100',
            'sortOrder':'asc','sortField':'title','priceType':'elite_price'
          }
          url=base+'?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json','Origin':'https://cannacabana.com','Referer':'https://cannacabana.com/collections/whole-flower?sID=3658'})
          t=time.time()
          with urllib.request.urlopen(req,timeout=15) as r:
              raw=r.read().decode('utf-8','ignore')
          elapsed=time.time()-t
          data=json.loads(raw)
          print('CANNA_SECONDS',round(elapsed,3),'COUNT',len(data.get('data') or []),'PAGINATION',data.get('pagination'))
          accepted=[]
          for prod in data.get('data') or []:
              for var in prod.get('variants') or []:
                  pr=var.get('pricing') or {}
                  try: eq=float(pr.get('equivalent_g') or 0); thc=float(pr.get('thc_level') or 0); ep=float(pr.get('elite_price') or 0); qty=float(pr.get('qty_available') or 0)
                  except: continue
                  stores=str(pr.get('elite_stores') or '').split(',')
                  if abs(eq-28)<0.05 and 29.97 <= thc <= 34.97 and ep>0 and qty>0 and ('3658' in [s.strip() for s in stores] or not str(pr.get('elite_stores') or '').strip()):
                      accepted.append((prod.get('title'),thc,ep,qty))
          print('CANNA_ACCEPTED',len(accepted))
          for x in accepted: print('CANNA_ITEM',x)
          if elapsed >= 15:
              raise SystemExit('Canna API exceeded 15 seconds')
          PY
