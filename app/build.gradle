plugins {
    id 'com.android.application'
}

android {
    namespace 'com.compacana.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.compacana.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies {
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
}
